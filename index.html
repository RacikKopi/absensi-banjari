<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Presensi ASEB - MTsN 3 Mojokerto</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- FontAwesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    body {
      background-color: #f4f6f0;
      background-image: radial-gradient(#d1d5db 0.75px, transparent 0.75px);
      background-size: 16px 16px;
    }
  </style>
</head>
<body class="min-h-screen flex flex-col justify-between font-sans text-gray-800">

  <!-- Header / Navigation -->
  <header class="bg-emerald-900 text-white shadow-lg border-b-4 border-amber-400">
    <div class="max-w-4xl mx-auto px-4 py-4 flex flex-col sm:flex-row items-center justify-between gap-4">
      
      <!-- Custom Logo ASEB (Hadrah + Mic Icon) -->
      <div class="flex items-center space-x-3">
        <div class="w-14 h-14 bg-amber-400 rounded-full flex items-center justify-center shadow-md relative text-emerald-950">
          <!-- Hadrah Drum Icon + Mic Icon Overlay -->
          <i class="fa-solid fa-drum text-2xl"></i>
          <i class="fa-solid fa-microphone text-xs absolute top-2 right-2 bg-emerald-900 text-amber-400 p-1 rounded-full"></i>
        </div>
        <div>
          <h1 class="text-2xl font-bold tracking-wide text-amber-300">ASEB</h1>
          <p class="text-xs text-emerald-100 font-medium">Absensi Siswa Ekstra Banjari</p>
          <p class="text-[10px] text-emerald-200">MTsN 3 Mojokerto</p>
        </div>
      </div>

      <div class="text-center sm:text-right text-xs text-amber-200 bg-emerald-950/50 px-3 py-2 rounded-lg border border-amber-500/30">
        <i class="fa-regular fa-calendar-check mr-1"></i>
        <span id="tanggal-sekarang"></span>
      </div>

    </div>
  </header>

  <!-- Main Content / Form Container -->
  <main class="max-w-2xl w-full mx-auto p-4 sm:p-6 my-6">
    <div class="bg-white rounded-2xl shadow-xl border border-emerald-100 overflow-hidden">
      
      <div class="bg-gradient-to-r from-emerald-800 to-emerald-700 p-4 text-white text-center border-b border-amber-400/40">
        <h2 class="text-lg font-semibold flex items-center justify-center gap-2">
          <i class="fa-solid fa-pen-to-square text-amber-300"></i>
          Formulir Presensi Ekstrakurikuler
        </h2>
      </div>

      <form id="form-presensi" class="p-6 space-y-5">
        
        <!-- Pilihan Kelas -->
        <div>
          <label class="block text-sm font-semibold text-emerald-900 mb-2">
            <i class="fa-solid fa-school text-emerald-600 mr-1"></i> Pilih Kelas
          </label>
          <select id="kelas" required class="w-full px-4 py-2.5 rounded-lg border border-gray-300 focus:ring-2 focus:ring-emerald-500 focus:border-emerald-500 outline-none transition bg-gray-50 text-gray-800">
            <option value="" disabled selected>-- Pilih Kelas --</option>
            <!-- Opsi Kelas dipopulasikan otomatis oleh JavaScript -->
          </select>
        </div>

        <!-- Pilihan Nama Siswa -->
        <div>
          <label class="block text-sm font-semibold text-emerald-900 mb-2">
            <i class="fa-solid fa-user-graduate text-emerald-600 mr-1"></i> Pilih Nama Siswa
          </label>
          <select id="nama" required class="w-full px-4 py-2.5 rounded-lg border border-gray-300 focus:ring-2 focus:ring-emerald-500 focus:border-emerald-500 outline-none transition bg-gray-50 text-gray-800">
            <option value="" disabled selected>-- Pilih Nama Siswa --</option>
            <!-- Opsi Nama dipopulasikan dari JavaScript -->
          </select>
        </div>

        <!-- Radio Button Status Kehadiran -->
        <div>
          <label class="block text-sm font-semibold text-emerald-900 mb-2">
            <i class="fa-solid fa-clipboard-user text-emerald-600 mr-1"></i> Status Kehadiran
          </label>
          <div class="grid grid-cols-2 sm:grid-cols-4 gap-3">
            
            <label class="flex items-center justify-center p-3 border rounded-xl cursor-pointer hover:bg-emerald-50 transition border-gray-200">
              <input type="radio" name="status" value="Hadir (H)" required class="text-emerald-600 focus:ring-emerald-500 mr-2">
              <span class="text-sm font-medium text-emerald-900">Hadir (H)</span>
            </label>

            <label class="flex items-center justify-center p-3 border rounded-xl cursor-pointer hover:bg-amber-50 transition border-gray-200">
              <input type="radio" name="status" value="Izin (I)" class="text-amber-600 focus:ring-amber-500 mr-2">
              <span class="text-sm font-medium text-amber-900">Izin (I)</span>
            </label>

            <label class="flex items-center justify-center p-3 border rounded-xl cursor-pointer hover:bg-blue-50 transition border-gray-200">
              <input type="radio" name="status" value="Sakit (S)" class="text-blue-600 focus:ring-blue-500 mr-2">
              <span class="text-sm font-medium text-blue-900">Sakit (S)</span>
            </label>

            <label class="flex items-center justify-center p-3 border rounded-xl cursor-pointer hover:bg-red-50 transition border-gray-200">
              <input type="radio" name="status" value="Tidak Aktif (TA)" class="text-red-600 focus:ring-red-500 mr-2">
              <span class="text-sm font-medium text-red-900">Tidak Aktif (TA)</span>
            </label>

          </div>
        </div>

        <!-- Keterangan Tambahan -->
        <div>
          <label class="block text-sm font-semibold text-emerald-900 mb-2">
            <i class="fa-solid fa-note-sticky text-emerald-600 mr-1"></i> Keterangan (Opsional)
          </label>
          <input type="text" id="keterangan" placeholder="Contoh: Izin acara keluarga / Sakit demam" class="w-full px-4 py-2 rounded-lg border border-gray-300 focus:ring-2 focus:ring-emerald-500 outline-none transition text-sm">
        </div>

        <!-- Tombol Kirim -->
        <button type="submit" id="btn-submit" class="w-full py-3 bg-emerald-700 hover:bg-emerald-800 text-white font-bold rounded-xl shadow-md transition duration-200 flex items-center justify-center gap-2 border-b-4 border-emerald-900">
          <i class="fa-solid fa-paper-plane"></i> Simpan Presensi
        </button>

      </form>

      <!-- Pesan Notifikasi -->
      <div id="notifikasi" class="hidden p-4 mx-6 mb-6 rounded-lg text-center text-sm font-medium"></div>

    </div>
  </main>

  <!-- Footer -->
  <footer class="bg-emerald-950 text-emerald-200 text-center py-4 text-xs border-t border-amber-400/30">
    <p>&copy; Ekstrakurikuler Banjari - MTsN 3 Mojokerto</p>
  </footer>

  <!-- Logic JavaScript -->
  <script>
    // =========================================================================
    // 1. GANTI DENGAN URL WEB APP GOOGLE APPS SCRIPT ANDA
    // =========================================================================
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbybopI6oOZc01sHdYiqAJtoxboRRFo4yCrn7moxQkCc-GxrKygnmsyc3eLaTGwYnyE1/exec";

    // =========================================================================
    // 2. DAFTAR KELAS (7 A-J, 8 A-J, 9 A-J)
    // =========================================================================
    const tingkatan = ['7', '8', '9'];
    const abjad = ['A', 'B', 'C', 'D', 'E', 'F', 'G', 'H', 'I', 'J'];
    const selectKelas = document.getElementById('kelas');

    tingkatan.forEach(t => {
      abjad.forEach(a => {
        const option = document.createElement('option');
        option.value = `Kelas ${t} ${a}`;
        option.textContent = `Kelas ${t} ${a}`;
        selectKelas.appendChild(option);
      });
    });

    // =========================================================================
    // 3. DAFTAR 100 NAMA SISWA BANJARI (Bisa diupdate sesuai kebutuhan)
    // =========================================================================
    const daftarSiswa = "Ahmad Fauzi", "Badrul Munir", "Cahaya Ramadhan", "Ahmad Fauzi", "Badrul Munir", "Ahmad Fauzi", "Badrul Munir", "Cahaya Ramadhan", "Ahmad Fauzi", "Badrul Munir", "Ahmad Fauzi", "Badrul Munir", "Cahaya Ramadhan", "Ahmad Fauzi", "Badrul Munir", "Ahmad Fauzi", "Badrul Munir", "Cahaya Ramadhan", "Ahmad Fauzi", "Badrul Munir", "Ahmad Fauzi", "Badrul Munir", "Cahaya Ramadhan", "Ahmad Fauzi", "Badrul Munir", "Ahmad Fauzi", "Badrul Munir", "Cahaya Ramadhan", "Ahmad Fauzi", "Badrul Munir", "Ahmad Fauzi", "Badrul Munir", "Cahaya Ramadhan", "Ahmad Fauzi", "Badrul Munir", "Ahmad Fauzi", "Badrul Munir", "Cahaya Ramadhan", "Ahmad Fauzi", "Badrul Munir", "Ahmad Fauzi", "Badrul Munir", "Cahaya Ramadhan", "Ahmad Fauzi", "Badrul Munir", "Ahmad Fauzi", "Badrul Munir", "Cahaya Ramadhan", "Ahmad Fauzi", "Badrul Munir", "Ahmad Fauzi", "Badrul Munir", "Cahaya Ramadhan", "Ahmad Fauzi", "Badrul Munir", "Ahmad Fauzi", "Badrul Munir", "Cahaya Ramadhan", "Ahmad Fauzi", "Badrul Munir", "Ahmad Fauzi", "Badrul Munir", "Cahaya Ramadhan", "Ahmad Fauzi", "Badrul Munir", "Ahmad Fauzi", "Badrul Munir", "Cahaya Ramadhan", "Ahmad Fauzi", "Badrul Munir", "Ahmad Fauzi", "Badrul Munir", "Cahaya Ramadhan", "Ahmad Fauzi", "Badrul Munir", "Ahmad Fauzi", "Badrul Munir", "Cahaya Ramadhan", "Ahmad Fauzi", "Badrul Munir", "Ahmad Fauzi", "Badrul Munir", "Cahaya Ramadhan", "Ahmad Fauzi", "Badrul Munir", "Ahmad Fauzi", "Badrul Munir", "Cahaya Ramadhan", "Ahmad Fauzi", "Badrul Munir", "Ahmad Fauzi", "Badrul Munir", "Cahaya Ramadhan", "Ahmad Fauzi", "Badrul Munir", "Ahmad Fauzi", "Badrul Munir", "Cahaya Ramadhan", "Ahmad Fauzi", "Badrul Munir",.from({ length: 100 }, (_, i) => `Siswa Banjari ${i + 1}`);
    
    // Catatan: Jika ingin mengganti dengan nama asli, ubah array di atas seperti ini:
    // const daftarSiswa = ["Ahmad Fauzi", "Badrul Munir", "Cahaya Ramadhan", "Ahmad Fauzi", "Badrul Munir", "Ahmad Fauzi", "Badrul Munir", "Cahaya Ramadhan", "Ahmad Fauzi", "Badrul Munir", "Ahmad Fauzi", "Badrul Munir", "Cahaya Ramadhan", "Ahmad Fauzi", "Badrul Munir", "Ahmad Fauzi", "Badrul Munir", "Cahaya Ramadhan", "Ahmad Fauzi", "Badrul Munir", "Ahmad Fauzi", "Badrul Munir", "Cahaya Ramadhan", "Ahmad Fauzi", "Badrul Munir", "Ahmad Fauzi", "Badrul Munir", "Cahaya Ramadhan", "Ahmad Fauzi", "Badrul Munir", "Ahmad Fauzi", "Badrul Munir", "Cahaya Ramadhan", "Ahmad Fauzi", "Badrul Munir", "Ahmad Fauzi", "Badrul Munir", "Cahaya Ramadhan", "Ahmad Fauzi", "Badrul Munir", "Ahmad Fauzi", "Badrul Munir", "Cahaya Ramadhan", "Ahmad Fauzi", "Badrul Munir", "Ahmad Fauzi", "Badrul Munir", "Cahaya Ramadhan", "Ahmad Fauzi", "Badrul Munir", "Ahmad Fauzi", "Badrul Munir", "Cahaya Ramadhan", "Ahmad Fauzi", "Badrul Munir", "Ahmad Fauzi", "Badrul Munir", "Cahaya Ramadhan", "Ahmad Fauzi", "Badrul Munir", "Ahmad Fauzi", "Badrul Munir", "Cahaya Ramadhan", "Ahmad Fauzi", "Badrul Munir", "Ahmad Fauzi", "Badrul Munir", "Cahaya Ramadhan", "Ahmad Fauzi", "Badrul Munir", "Ahmad Fauzi", "Badrul Munir", "Cahaya Ramadhan", "Ahmad Fauzi", "Badrul Munir", "Ahmad Fauzi", "Badrul Munir", "Cahaya Ramadhan", "Ahmad Fauzi", "Badrul Munir", "Ahmad Fauzi", "Badrul Munir", "Cahaya Ramadhan", "Ahmad Fauzi", "Badrul Munir", "Ahmad Fauzi", "Badrul Munir", "Cahaya Ramadhan", "Ahmad Fauzi", "Badrul Munir", "Ahmad Fauzi", "Badrul Munir", "Cahaya Ramadhan", "Ahmad Fauzi", "Badrul Munir", "Ahmad Fauzi", "Badrul Munir", "Cahaya Ramadhan", "Ahmad Fauzi", "Badrul Munir",];

    const selectNama = document.getElementById('nama');
    daftarSiswa.forEach(nama => {
      const option = document.createElement('option');
      option.value = nama;
      option.textContent = nama;
      selectNama.appendChild(option);
    });

    // Tampilkan Tanggal Hari Ini
    document.getElementById('tanggal-sekarang').textContent = new Date().toLocaleDateString('id-ID', {
      weekday: 'long', year: 'numeric', month: 'long', day: 'numeric'
    });

    // =========================================================================
    // 4. PROSES PENGIRIMAN DATA KE GOOGLE SHEETS
    // =========================================================================
    const form = document.getElementById('form-presensi');
    const notifikasi = document.getElementById('notifikasi');
    const btnSubmit = document.getElementById('btn-submit');

    form.addEventListener('submit', function(e) {
      e.preventDefault();

      if (SCRIPT_URL === "https://script.google.com/macros/s/AKfycbybopI6oOZc01sHdYiqAJtoxboRRFo4yCrn7moxQkCc-GxrKygnmsyc3eLaTGwYnyE1/exec") {
        alert("Silakan ganti SCRIPT_URL di dalam file HTML dengan URL Web App dari Google Apps Script Anda!");
        return;
      }

      // Ambil nilai dari form
      const nama = document.getElementById('nama').value;
      const kelas = document.getElementById('kelas').value;
      const status = document.querySelector('input[name="status"]:checked').value;
      const keterangan = document.getElementById('keterangan').value;

      // Ubah tampilan tombol saat proses kirim
      btnSubmit.disabled = true;
      btnSubmit.innerHTML = `<i class="fa-solid fa-spinner animate-spin"></i> Menyimpan...`;

      // Buat objek data
      const payload = { nama, kelas, status, keterangan };

      // Kirim data menggunakan Fetch API
      fetch(SCRIPT_URL, {
        method: 'POST',
        mode: 'no-cors', // Menghindari batasan CORS dari Google Apps Script
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(payload)
      })
      .then(() => {
        // Tampilkan pesan sukses
        notifikasi.className = "p-4 mx-6 mb-6 rounded-lg text-center text-sm font-medium bg-emerald-100 text-emerald-800 border border-emerald-300 block";
        notifikasi.innerHTML = `<i class="fa-solid fa-circle-check mr-1"></i> Presensi untuk <strong>${nama}</strong> (${kelas}) berhasil disimpan!`;
        
        // Reset form
        form.reset();
      })
      .catch(error => {
        // Tampilkan pesan error jika gagal
        notifikasi.className = "p-4 mx-6 mb-6 rounded-lg text-center text-sm font-medium bg-red-100 text-red-800 border border-red-300 block";
        notifikasi.innerHTML = `<i class="fa-solid fa-triangle-exclamation mr-1"></i> Gagal menyimpan presensi. Silakan coba lagi.`;
        console.error('Error:', error);
      })
      .finally(() => {
        // Kembalikan status tombol
        btnSubmit.disabled = false;
        btnSubmit.innerHTML = `<i class="fa-solid fa-paper-plane"></i> Simpan Presensi`;
      });
    });
  </script>
</body>
</html>
